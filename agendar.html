<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#111111"><title>Agendar orçamento | JB Serviços Elétricos</title><style>
:root{--bg:#101010;--panel:#1b1b1b;--line:#343434;--yellow:#ffd400;--text:#f7f7f7;--muted:#b8b8b8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px Arial,sans-serif}.wrap{max-width:680px;margin:auto;padding:20px}.brand{font-size:20px;font-weight:800;padding:12px 0 20px;border-bottom:1px solid var(--line)}.brand span{color:var(--yellow)}.panel{margin-top:22px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px}h1{font-size:27px;margin:0 0 10px}p{color:var(--muted);line-height:1.5}label{display:block;margin:13px 0 6px;color:var(--muted);font-size:14px}input,select{width:100%;padding:13px;border-radius:9px;border:1px solid #555;background:#111;color:white;font:inherit}button{width:100%;margin-top:18px;background:var(--yellow);color:#111;border:0;border-radius:9px;padding:14px;font-size:16px;font-weight:800;cursor:pointer}.slotlist{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:9px;margin-top:12px}.slot{padding:12px;border:1px solid #555;border-radius:9px;background:#111;color:white;cursor:pointer}.slot.selected{background:var(--yellow);color:#111;border-color:var(--yellow);font-weight:bold}.slot:disabled{opacity:.4}.status{white-space:pre-wrap;color:var(--yellow);margin-top:12px}.small{font-size:13px}.hidden{display:none!important}a{color:var(--yellow)}
</style></head><body><main class="wrap"><div class="brand"><span>⚡ JB</span> SERVIÇOS ELÉTRICOS</div><section class="panel"><h1>Agende seu orçamento</h1><p>Escolha um dos horários liberados pela JB Serviços Elétricos. Cada horário só pode ser reservado uma vez.</p><label for="date">Dia disponível</label><select id="date"><option value="">Carregando datas...</option></select><div id="slots" class="slotlist"></div><label for="name">Seu nome completo</label><input id="name" autocomplete="name" placeholder="Digite seu nome"><label for="phone">WhatsApp para contato</label><input id="phone" type="tel" autocomplete="tel" placeholder="(73) 99999-9999"><label for="service">Qual serviço você precisa?</label><select id="service"><option value="">Selecione o serviço</option><option>Instalação elétrica</option><option>Manutenção elétrica</option><option>Instalação de carregador de carro elétrico</option><option>Iluminação</option><option>Ventilador de teto</option><option>Outro serviço</option></select><button id="bookBtn">Confirmar agendamento</button><div id="status" class="status" role="status"></div><p class="small">Se precisar alterar seu horário, entre em contato com a JB pelo WhatsApp.</p></section><p class="small"><a href="index.html">← Voltar ao site da JB</a></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
// CONFIGURAÇÃO: use a mesma URL e chave pública do arquivo admin.html.
const SUPABASE_URL = 'COLE_AQUI_A_URL_DO_SEU_PROJETO';
const SUPABASE_ANON_KEY = 'COLE_AQUI_A_CHAVE_PUBLICA_DO_SEU_PROJETO';
const configured=SUPABASE_URL.startsWith('https://')&&!SUPABASE_URL.includes('COLE_AQUI')&&!SUPABASE_ANON_KEY.includes('COLE_AQUI');const $=id=>document.getElementById(id);let db=null,chosen=null,allSlots=[];
function br(d){return new Date(d+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'2-digit'});}function status(t){$('status').textContent=t;}
async function loadSlots(){if(!configured){$('date').innerHTML='<option>Configuração pendente</option>';status('O agendamento será ativado depois de conectar o banco de dados. Veja LEIA-ME.txt.');return;}db=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);const {data,error}=await db.from('slots').select('id,slot_date,start_time').eq('status','available').gte('slot_date',new Date().toLocaleDateString('en-CA')).order('slot_date').order('start_time');if(error){status('Não foi possível carregar os horários. Tente novamente mais tarde.');return;}allSlots=data||[];const dates=[...new Set(allSlots.map(s=>s.slot_date))];$('date').innerHTML='<option value="">Escolha uma data</option>';dates.forEach(d=>{const o=document.createElement('option');o.value=d;o.textContent=br(d);$('date').appendChild(o);});if(!dates.length){$('date').innerHTML='<option value="">Nenhum horário disponível no momento</option>';status('Ainda não há horários liberados. Volte mais tarde.');}renderSlots();}
function renderSlots(){chosen=null;$('slots').innerHTML='';const d=$('date').value;allSlots.filter(s=>s.slot_date===d).forEach(s=>{const b=document.createElement('button');b.type='button';b.className='slot';b.textContent=s.start_time.slice(0,5);b.onclick=()=>{chosen=s.id;document.querySelectorAll('.slot').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');};$('slots').appendChild(b);});}
$('date').onchange=renderSlots;$('bookBtn').onclick=async()=>{if(!db||!configured){status('O sistema ainda está em configuração.');return;}const name=$('name').value.trim(),phone=$('phone').value.trim(),service=$('service').value;if(!chosen){status('Escolha um horário disponível.');return;}if(!name||!phone||!service){status('Preencha seu nome, WhatsApp e serviço desejado.');return;}$('bookBtn').disabled=true;$('bookBtn').textContent='Confirmando...';const {data,error}=await db.rpc('book_slot',{p_slot_id:chosen,p_customer_name:name,p_customer_phone:phone,p_service:service});if(error||!data||!data.success){status('Esse horário pode ter acabado de ser reservado. Atualize a página e escolha outro.');await loadSlots();}else{status('Agendamento solicitado com sucesso! A JB Serviços Elétricos entrará em contato pelo WhatsApp para confirmar os detalhes.');$('name').value='';$('phone').value='';$('service').value='';await loadSlots();} $('bookBtn').disabled=false;$('bookBtn').textContent='Confirmar agendamento';};loadSlots();
</script></body></html>
